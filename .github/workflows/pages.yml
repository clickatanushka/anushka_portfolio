
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Append the commit hash to the CSS/JS links so browsers fetch fresh
      # copies after every push instead of serving a cached stylesheet.
      - name: Cache-bust assets
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s#css/styles.css\"#css/styles.css?v=${v}\"#g; s#js/script.js\"#js/script.js?v=${v}\"#g" index.html
          grep -n "?v=${v}" index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4
